# kube-prometheus-stack Helm Chart의 사용자 정의 값이다.
# Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter를 한 번에 구성한다.

# Kubernetes 기본 Alert Rule을 활성화한다.
defaultRules:
  create: true

# Grafana 설정이다.
grafana:
  # Grafana 서버를 설치한다.
  enabled: true

  # 교육 환경에서는 외부 ALB를 추가하지 않고 port-forward로 접속한다.
  service:
    type: ClusterIP

  # Dashboard ConfigMap을 자동 검색하는 sidecar를 활성화한다.
  sidecar:
    dashboards:
      enabled: true
      # 모든 namespace의 grafana_dashboard 라벨 ConfigMap을 검색한다.
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true

  # 실습용 기본 관리자 계정이다.
  # 비밀번호는 Chart가 생성한 Secret에서 조회하며 Git에 평문으로 저장하지 않는다.
  adminUser: admin

  # Grafana Pod가 재시작되어도 설정과 Dashboard는 Git/sidecar에서 다시 구성되므로
  # 교육용 기본값에서는 별도 EBS 영구 볼륨을 사용하지 않는다.
  persistence:
    enabled: false

  # Grafana Pod의 스케줄링 기준 자원이다.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Prometheus 서버 설정이다.
prometheus:
  enabled: true
  prometheusSpec:
    # Helm release 라벨이 없는 사용자 ServiceMonitor/PodMonitor도 검색한다.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # 모든 namespace의 ServiceMonitor/PodMonitor를 검색할 수 있게 한다.
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    # 메트릭 보관 기간이다. 교육 환경 비용과 저장공간을 고려해 3일로 설정한다.
    retention: 3d

    # 저장 크기 상한을 지정해 디스크 사용량 증가를 제한한다.
    retentionSize: 8GB

    # 교육용 기본 구성에서는 임시 볼륨을 사용한다.
    # 장기 운영 시 EBS CSI StorageClass를 사용하는 volumeClaimTemplate로 변경한다.
    storageSpec: {}

    # Prometheus Pod의 자원 요청/제한이다.
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

# Alertmanager를 활성화한다.
# 현재 패키지는 알림 규칙까지 제공하며 이메일/Slack 수신처는 별도로 연결할 수 있다.
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Kubernetes 객체 상태를 메트릭으로 변환한다.
kube-state-metrics:
  enabled: true

# 각 Node에 DaemonSet으로 배치되어 OS/Node 메트릭을 수집한다.
prometheus-node-exporter:
  enabled: true

# Kubernetes API Server 메트릭을 수집한다.
kubeApiServer:
  enabled: true

# kubelet/cAdvisor를 통해 Pod와 Container 메트릭을 수집한다.
kubelet:
  enabled: true

# EKS 관리형 Control Plane에서는 아래 컴포넌트가 사용자 Node에 직접 노출되지 않을 수 있다.
# 불필요한 Target Down 경고를 줄이기 위해 기본 수집을 비활성화한다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# Prometheus Operator 설정이다.
prometheusOperator:
  enabled: true
  # CRD는 Chart가 관리한다.
  crds:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
